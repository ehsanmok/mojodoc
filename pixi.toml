[workspace]
authors = ["ehsanmok <ehsanmok@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojodoc"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "mojodoc"
version = "0.1.0"

[package.build]
# Lower bound only, deliberately.
#
# A build backend declares which `pixi-build-api-version` it speaks and
# pixi provides that as a virtual package, so matching backend to client
# is the solver's job. An exact pin takes that choice away: `==0.3.13`
# speaks API 4, and every pixi newer than 0.70.2 provides >= 5, so
# resolution failed outright with "pixi-build-api-version >=4,<5, for
# which no candidates were found".
#
# That broke consumers, not just this repo. Because this is a git
# *source* dependency, pixi resolves this backend while solving every
# environment of every project that depends on it -- so this pin made a
# plain `pixi install` fail in ehsanmok/json (its issue #3) even for
# users who never touch this package.
#
# A range lets pixi 0.70.x pick 0.3.13 and newer pixi pick a 0.4.x that
# speaks its API.
backend = { name = "pixi-build-rattler-build", version = ">=0.3.13" }

[dependencies]
nodejs = ">=20"
pnpm = ">=8"

[feature.dev.dependencies]
mojo = ">=1.1.0,<2.0.0"
pre-commit = ">=4.2.0,<5"

[environments]
default = { features = ["dev"] }

[tasks]
# Setup - install npm dependencies
install = "pnpm install"

# Pre-commit and formatting
install-pre-commit = "pre-commit install"
format = { cmd = "pnpm run format", depends-on = ["install-pre-commit"] }
format-check = "pnpm run format:check"
lint = "pnpm run lint"
lint-fix = "pnpm run lint:fix"

# Development tasks
dev = "pnpm run dev"
build = "pnpm run build"
tests = "pnpm test"

# Check all (format + lint + tests)
check = { cmd = "pnpm run format:check && pnpm run lint && pnpm test" }

# Main CLI - usage: pixi run mojodoc [args...]
# Examples:
#   pixi run mojodoc ../mojson/mojson --open
#   pixi run mojodoc ../mojson/mojson --out-dir ./docs
#   pixi run mojodoc serve ./target/doc --port 8080
mojodoc = "node ./packages/cli/dist/index.js"

# Shortcut to generate docs for current directory
docs = "node ./packages/cli/dist/index.js . --open"
